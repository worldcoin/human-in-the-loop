name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  human-in-the-loop:
    name: Human in the loop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --filter='@worldcoin/human-in-the-loop' run typecheck

      - name: Test
        run: bun --filter='@worldcoin/human-in-the-loop' run test

      - name: Build
        run: bun --filter='@worldcoin/human-in-the-loop' run build
